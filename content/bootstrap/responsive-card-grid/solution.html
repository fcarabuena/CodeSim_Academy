<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Card grid</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  </head>
  <body class="py-4">
    <div class="container">
      <h1 class="mb-4">Our courses</h1>
      <div class="row g-4">
        <div class="col-12 col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">HTML &amp; CSS</h5>
              <p class="card-text">Build and style your first web pages.</p>
              <a href="#" class="btn btn-primary">Start</a>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">JavaScript</h5>
              <p class="card-text">Make your pages interactive.</p>
              <a href="#" class="btn btn-primary">Start</a>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">Python</h5>
              <p class="card-text">A friendly first programming language.</p>
              <a href="#" class="btn btn-primary">Start</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
