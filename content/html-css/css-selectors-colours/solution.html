<!DOCTYPE html>
<html lang="en">
  <head>
    <title>My first styles</title>
    <style>
      h1 {
        color: #2563eb;
      }

      .highlight {
        background-color: yellow;
      }

      #intro {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to my page</h1>
    <p id="intro">This paragraph introduces the page.</p>
    <p>CSS makes pages <span class="highlight">look great</span> without changing the HTML.</p>
    <p>You can reuse a <span class="highlight">class</span> as many times as you like.</p>
  </body>
</html>
