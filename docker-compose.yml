# Local development database. Start with: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codesim
      POSTGRES_PASSWORD: codesim
      POSTGRES_DB: codesim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesim -d codesim"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
